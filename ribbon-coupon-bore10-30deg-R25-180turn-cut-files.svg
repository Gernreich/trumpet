<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="436.89mm" height="66.80mm" viewBox="0 0 436.89 66.80">
<title>Ribbon bore - 10mm square bore, 30 degree facets, coupon</title>
<desc>1 user unit = 1mm. A duct of constant 10 x 10mm section swept along a planar curve. Two identical cheeks (0, both the same way up) and 16 wall panels numbered along the flow. The section is exact along every facet and 3.5% over at each mitre. 3mm ply, 0.1mm kerf, 0.025mm play per side taken out of the slot and never off the tab. blue #0000ff engraves, orange #ff8000 cuts the slots first, black #000000 frees the parts.</desc>
