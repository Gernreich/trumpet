<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="296.89mm" height="99.39mm" viewBox="0 0 296.89 99.39">
<title>Ribbon bore coupon - 10mm square bore, 30 degree facets, R25 180 degree bend</title>
<desc>1 user unit = 1mm. A duct of constant 10 x 10mm section swept along a planar curve. Two identical cheeks (C, both the same way up) and 16 wall panels: I* inside the bend, O* outside, numbered along the flow. The section is exact along every facet and 3.5% over at each mitre. 3mm ply, 0.1mm kerf, 0.025mm play per side taken out of the slot and never off the tab. blue #0000ff engraves, orange #ff8000 cuts the slots first, black #000000 frees the parts.</desc>
