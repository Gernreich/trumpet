<svg xmlns="http://www.w3.org/2000/svg" width="483.20mm" height="71.20mm" viewBox="0 0 483.20 71.20">
<title>notch-a bore - section 2 of 2, bend URRR~b, 6 parts on 483x71mm</title>
<desc>1 user unit = 1mm. 16mm square bore in 3mm stock, so a 22mm block pitch. Blocks 5-9 of the walk, entering on U and leaving on E, a 4x2 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
