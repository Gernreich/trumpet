<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="345.20mm" height="90.20mm" viewBox="0 0 345.20 90.20">
<title>notch-c bore - section 1 of 2, bend DDR~a, 6 parts on 345x90mm</title>
<desc>1 user unit = 1mm. 16mm square bore in 3mm stock, so a 22mm block pitch. Blocks 1-4 of the walk, entering on N and leaving on U, a 2x3 block plate laid flat. Two face plates (mirror images) and the side walls; every part carries the section number only. Inner cuts are the port and come before their outline. black #000000 cuts, blue #0000ff engraves.</desc>
